
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HookFlow | Webhook Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            color: #202938;
        }
        header {
            background: #172554;
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
        }
        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 25px 0;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #0000000a;
        }
        .number {
            font-size: 30px;
            font-weight: bold;
        }
        .muted {
            color: #64748b;
        }
        @media (max-width: 650px) {
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>HookFlow</header>

    <main>
        <h1>Webhook Delivery Dashboard</h1>
        <p class="muted">
            Monitor events, delivery attempts, and failed webhooks.
        </p>

        <section class="cards">
            <div class="card">
                <p class="muted">Total Events</p>
                <div class="number">0</div>
            </div>
            <div class="card">
                <p class="muted">Delivered</p>
                <div class="number">0</div>
            </div>
            <div class="card">
                <p class="muted">Failed</p>
                <div class="number">0</div>
            </div>
        </section>

        <section class="card">
            <h2>Recent Deliveries</h2>
            <p class="muted">
                Your webhook delivery history will appear here.
            </p>
        </section>
    </main>
</body>
</html>
